<text x="650" y="270" text-anchor="middle" fill="#F0B64E" font-size="84" letter-spacing="10" opacity="0" transform="rotate(-7 650 270)" style="animation:whisper .8s ease 3s forwards">PARTIAL DISCLOSURE</text>
