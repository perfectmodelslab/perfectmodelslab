<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 520"><title>BuildGuide, a plan of a private build</title>
<style>
  text { font-family: Consolas, 'Courier New', monospace; }
  .wall { stroke: #F0B64E; stroke-width: 2.2; }
  .lbl { opacity: 0; animation: fade .6s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes whisper { to { opacity: .05; } }
  @keyframes blink { 0%, 100% { opacity: .12; } 50% { opacity: 1; } }
</style>
<rect width="1720" height="520" fill="#101018"/>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1d1d2b" stroke-width="1"/></pattern></defs><rect x="24" y="24" width="1672" height="472" fill="url(#g)"/>
<rect x="20" y="20" width="1680" height="480" rx="14" fill="none" stroke="#2a2a3c" stroke-width="1.4"/>
<text x="120" y="66" fill="#F0B64E" font-size="44" font-weight="bold" letter-spacing="12" class="lbl" style="animation-delay:.2s">BUILDGUIDE</text>
<text x="1180" y="62" text-anchor="end" fill="#6f6c82" font-size="15" letter-spacing="2" class="lbl" style="animation-delay:.4s">multi-role construction platform · sheet 01 · partial disclosure</text>
